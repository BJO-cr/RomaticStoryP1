<!DOCTYPE html>
<html>

<head>
    <title>Our Story</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Georgia', serif;
            background: #eaeaea;
            color: #222;
        }

        .container {
            background: #fdfdfd;
            padding: 65px 50px;
            max-width: 500px;
            margin: 20px;
            text-align: center;
            border: 1px solid #ddd;
        }

        .small-text {
            font-family: Arial, sans-serif;
            font-size: 11px;
            letter-spacing: 5px;
            text-transform: uppercase;
            color: #888;
            margin-bottom: 30px;
        }

        h1 {
            font-size: 38px;
            font-weight: normal;
            margin-bottom: 25px;
            letter-spacing: -1px;
        }

        p {
            font-size: 17px;
            line-height: 1.9;
            color: #666;
            margin-bottom: 35px;
        }

        button {
            background: #222;
            color: white;
            border: none;
            padding: 14px 30px;
            font-size: 12px;
            letter-spacing: 2px;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            background: #777;
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="small-text">Hello - World</div>
        <h1>
            A Story Unlike Any Other.
        </h1>

        <p>
            This would be a romantic story that none has ever come before.
            You think so too, right?
        </p>



    </div>

</body>

</html>
